services:
  # ── 1. CƠ SỞ DỮ LIỆU POSTGRESQL (ĐỘC LẬP HOÀN TOÀN) ────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: ocr_sodo_postgres
    environment:
      POSTGRES_USER: ${PG_USER:-postgres}
      POSTGRES_PASSWORD: ${PG_PASSWORD:?Set PG_PASSWORD in .env before starting Docker}
      POSTGRES_DB: ${PG_DATABASE:-ocr_so_do}
    # Cổng kết nối riêng biệt cho Docker: 5434 (Host) -> 5432 (Container)
    # Không xung đột với PostgreSQL 18 trên máy chủ đang chạy cổng 5433
    ports:
      - "${OCR_BIND_HOST:-127.0.0.1}:5434:5432"
    volumes:
      - ocr_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "2"

  # ── 1b. IDENTITY DATABASE (KEYCLOAK) ───────────────────────────────────────
  keycloak-db:
    image: postgres:16-alpine
    container_name: ocr_sodo_keycloak_postgres
    environment:
      POSTGRES_USER: ${KEYCLOAK_DB_USER:-keycloak}
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Set KEYCLOAK_DB_PASSWORD in .env}
      POSTGRES_DB: ${KEYCLOAK_DB_DATABASE:-keycloak}
    volumes:
      - ocr_keycloak_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ── 1c. INTERNAL IDENTITY PROVIDER ─────────────────────────────────────────
  keycloak:
    image: quay.io/keycloak/keycloak:26.6.4
    container_name: ocr_sodo_keycloak
    # start (production mode) thay vì start-dev; --http-enabled cho phép HTTP trong mạng nội bộ
    command: start --import-realm --http-enabled=true --hostname-strict=false
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: keycloak-db
      KC_DB_URL_DATABASE: ${KEYCLOAK_DB_DATABASE:-keycloak}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER:-keycloak}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Set KEYCLOAK_DB_PASSWORD in .env}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_BOOTSTRAP_ADMIN_USERNAME:?Set KEYCLOAK_BOOTSTRAP_ADMIN_USERNAME in .env}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_BOOTSTRAP_ADMIN_PASSWORD:?Set KEYCLOAK_BOOTSTRAP_ADMIN_PASSWORD in .env}
      KC_HOSTNAME: ${OCR_KEYCLOAK_PUBLIC_URL:-http://127.0.0.1:8081}
      OCR_INITIAL_ADMIN_USERNAME: ${OCR_INITIAL_ADMIN_USERNAME:?Set OCR_INITIAL_ADMIN_USERNAME in .env}
      OCR_INITIAL_ADMIN_PASSWORD: ${OCR_INITIAL_ADMIN_PASSWORD:?Set OCR_INITIAL_ADMIN_PASSWORD in .env}
      OCR_KEYCLOAK_ADMIN_CLIENT_SECRET: ${OCR_KEYCLOAK_ADMIN_CLIENT_SECRET:?Set OCR_KEYCLOAK_ADMIN_CLIENT_SECRET in .env}
    ports:
      - "${OCR_BIND_HOST:-127.0.0.1}:8081:8080"
    volumes:
      - ./deployments/keycloak/ocr-so-do-realm.json:/opt/keycloak/data/import/ocr-so-do-realm.json:ro
    depends_on:
      keycloak-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080 2>/dev/null && echo OK || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 60s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1500m
          cpus: "2"

  # ── 2. BACKEND API & OCR PIPELINE ──────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: deployments/docker/Dockerfile.backend
    container_name: ocr_sodo_backend
    # Cổng kết nối riêng biệt cho Docker Backend: 8008 (Host) -> 8000 (Container)
    # Không xung đột với Backend chạy cục bộ đang dùng cổng 8000
    ports:
      - "${OCR_BIND_HOST:-127.0.0.1}:8008:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - PG_HOST=postgres
      - PG_PORT=5432
      - PG_USER=${PG_USER:-postgres}
      - PG_PASSWORD=${PG_PASSWORD:?Set PG_PASSWORD in .env before starting Docker}
      - PG_DATABASE=${PG_DATABASE:-ocr_so_do}
      - HF_HOME=/app/.cache/huggingface
      - TORCH_HOME=/app/.cache/torch
      - PADDLE_HOME=/app/.cache/paddle
      - OCR_AUTH_ENABLED=${OCR_AUTH_ENABLED:-true}
      - OCR_ALLOWED_ORIGINS=${OCR_ALLOWED_ORIGINS:-http://127.0.0.1:8088,http://localhost:8088}
      - OCR_KEYCLOAK_URL=http://keycloak:8080
      - OCR_KEYCLOAK_PUBLIC_URL=${OCR_KEYCLOAK_PUBLIC_URL:-http://127.0.0.1:8081}
      - OCR_KEYCLOAK_REALM=${OCR_KEYCLOAK_REALM:-ocr-so-do}
      - OCR_KEYCLOAK_CLIENT_ID=${OCR_KEYCLOAK_CLIENT_ID:-ocr-so-do-web}
      - OCR_KEYCLOAK_ADMIN_CLIENT_ID=${OCR_KEYCLOAK_ADMIN_CLIENT_ID:-ocr-so-do-admin-api}
      - OCR_KEYCLOAK_ADMIN_CLIENT_SECRET=${OCR_KEYCLOAK_ADMIN_CLIENT_SECRET:?Set OCR_KEYCLOAK_ADMIN_CLIENT_SECRET in .env}
      - OCR_ALLOWED_SOURCE_ROOTS=${OCR_ALLOWED_SOURCE_ROOTS:-}
    # CHÚ Ý: Không mount thư mục mã nguồn máy chủ (src) vào container để việc
    # sửa code trên máy không ảnh hưởng đến Docker đang chạy.
    # Chỉ khi nào chạy "docker compose build" thì code mới được cập nhật vào image.
    volumes:
      - ocr_outputs:/app/output
      - ocr_cache:/app/.cache
      - ocr_paddle_cache:/root/.paddleocr
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 10g
          cpus: "8"
        reservations:
          memory: 4g

  # ── 3. FRONTEND REACT + NGINX PROXY ────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: deployments/docker/Dockerfile.frontend
    container_name: ocr_sodo_frontend
    # Cổng kết nối riêng biệt cho Docker Frontend: 8088 (Host) -> 80 (Container)
    # Không xung đột với cổng 80 hay cổng 8080 / 5173
    ports:
      - "${OCR_BIND_HOST:-127.0.0.1}:8088:80"
    depends_on:
      - backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "1"

# Volume lưu trữ dữ liệu bền vững độc lập
volumes:
  ocr_pgdata:
    name: ocr_sodo_pgdata
  ocr_outputs:
    name: ocr_sodo_outputs
  ocr_cache:
    name: ocr_sodo_cache
  ocr_paddle_cache:
    name: ocr_sodo_paddle_cache
  ocr_keycloak_pgdata:
    name: ocr_sodo_keycloak_pgdata
