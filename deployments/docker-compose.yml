version: '3.8'

services:
  backend:
    build:
      context: ..
      dockerfile: deployments/docker/Dockerfile.backend
    ports:
      - "8000:8000"
    volumes:
      - ../output:/app/output
      - ../configs:/app/configs
    environment:
      - PYTHONUNBUFFERED=1
      - HF_HOME=/app/.cache/huggingface
      - TORCH_HOME=/app/.cache/torch
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  frontend:
    build:
      context: ..
      dockerfile: deployments/docker/Dockerfile.frontend
    ports:
      - "80:80"
    depends_on:
      - backend
