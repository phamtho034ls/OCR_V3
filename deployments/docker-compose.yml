services:
  postgres:
    image: postgres:16-alpine
    container_name: ocr_sodo_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ocr_password
      POSTGRES_DB: ocr_so_do
    ports:
      - "5434:5432"
    volumes:
      - ocr_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ocr_so_do"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ..
      dockerfile: deployments/docker/Dockerfile.backend
    container_name: ocr_sodo_backend
    ports:
      - "8008:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - PG_HOST=postgres
      - PG_PORT=5432
      - PG_USER=postgres
      - PG_PASSWORD=ocr_password
      - PG_DATABASE=ocr_so_do
      - HF_HOME=/app/.cache/huggingface
      - TORCH_HOME=/app/.cache/torch
      - PADDLE_HOME=/app/.cache/paddle
    volumes:
      - ocr_outputs:/app/output
      - ocr_cache:/app/.cache
      - ocr_paddle_cache:/root/.paddleocr
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ..
      dockerfile: deployments/docker/Dockerfile.frontend
    container_name: ocr_sodo_frontend
    ports:
      - "8088:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  ocr_pgdata:
    name: ocr_sodo_pgdata
  ocr_outputs:
    name: ocr_sodo_outputs
  ocr_cache:
    name: ocr_sodo_cache
  ocr_paddle_cache:
    name: ocr_sodo_paddle_cache
